<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Classification</title>
    <!-- CSS External -->
    <link rel="stylesheet" href="styles.css">
    <!-- ONNX Runtime Web & TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Flower Classifier</h2>
            <p>Unggah foto bunga untuk mengidentifikasi spesies secara otomatis.</p>
        </div>

        <label for="imageInput" class="upload-area">
            <svg class="upload-icon" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="upload-text">Pilih atau letakkan gambar</div>
            <div class="upload-subtext">Mendukung format JPEG, PNG, WEBP</div>
            <input type="file" id="imageInput" accept="image/*">
        </label>

        <div class="preview-wrapper" id="previewWrapper">
            <img id="imagePreview" alt="Preview File">
        </div>

        <div class="results-section">
            <h3>Hasil Prediksi</h3>
            <ul id="resultList" class="results-list">
                <div class="status-msg">Silakan unggah gambar terlebih dahulu.</div>
            </ul>
        </div>
    </div>

    <script>
        let session;
        let classNames = {};

        async function loadModel() {
            try {
                session = await ort.InferenceSession.create('./best.onnx');

                if (session.handler && session.handler.metadata && session.handler.metadata.names) {
                    const rawNames = session.handler.metadata.names;
                    classNames = JSON.parse(rawNames.replace(/'/g, '"'));
                    console.log('Metadata nama berhasil di-load dari ONNX');
                } else {
                    console.warn('Metadata ONNX tidak ada, membaca labels.json...');
                    const response = await fetch('./labels.json');
                    classNames = await response.json();
                }
            } catch (e) {
                console.error('Gagal memuat model atau label', e);
            }
        }

        loadModel();

        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewWrapper = document.getElementById('previewWrapper');
        const resultList = document.getElementById('resultList');

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];

            if (!file || !session) return;

            imagePreview.src = URL.createObjectURL(file);
            previewWrapper.style.display = 'block';

            resultList.innerHTML = `
                <div class="status-msg">
                    <div class="spinner"></div>
                    <span>Memproses gambar...</span>
                </div>
            `;

            imagePreview.onload = async () => {
                const tensorInput = await preprocessImage(imagePreview);

                const feeds = { [session.inputNames[0]]: tensorInput };
                const outputMap = await session.run(feeds);
                const outputData = outputMap[session.outputNames[0]].data;

                const predictions = getTopK(outputData, 5);

                resultList.innerHTML = '';
                predictions.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'result-item';
                    li.innerHTML = `
                        <div class="result-info">
                            <span>${item.label}</span>
                            <span>${item.confidence}%</span>
                        </div>
                        <div class="result-bar-bg">
                            <div class="result-bar-fill" style="width: ${item.confidence}%"></div>
                        </div>
                    `;
                    resultList.appendChild(li);
                });
            };
        });

        async function preprocessImage(imgElement) {
            return tf.tidy(() => {
                const tensor = tf.browser.fromPixels(imgElement)
                    .resizeNearestNeighbor([640, 640])
                    .toFloat()
                    .div(255.0)
                    .transpose([2, 0, 1])
                    .expandDims(0);

                return new ort.Tensor('float32', tensor.dataSync(), [1, 3, 640, 640]);
            });
        }

        function getTopK(scores, k) {
            const indexed = Array.from(scores).map((val, idx) => ({
                label: classNames[idx] || `Kelas ${idx}`,
                confidence: (val * 100).toFixed(2)
            }));
            indexed.sort((a, b) => b.confidence - a.confidence);
            return indexed.slice(0, k);
        }
    </script>
</body>
</html>
